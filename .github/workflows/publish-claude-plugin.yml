name: Publish Claude plugin branch

# The claude.ai plugin directory accepts only Markdown, JSON, YAML, images and
# a license from organizations that are not Verified. main also holds the
# Codex and Cursor manifests, the lint script and CI, so this job copies only
# the Claude plugin's files to the claude-plugin branch, which is the branch
# submitted to the directory. Never edit that branch by hand.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-claude-plugin
  cancel-in-progress: false

jobs:
  publish:
    name: Copy the Claude plugin to the claude-plugin branch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Build and push the branch
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          out="$(mktemp -d)"
          cp -R skills .mcp.json README.md LICENSE "$out/"
          mkdir -p "$out/.claude-plugin" "$out/assets"
          cp .claude-plugin/plugin.json "$out/.claude-plugin/"
          cp assets/logo.png "$out/assets/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin claude-plugin >/dev/null; then
            git fetch origin claude-plugin
            git worktree add publish origin/claude-plugin
            git -C publish checkout -B claude-plugin
          else
            git worktree add --detach publish
            git -C publish checkout --orphan claude-plugin
          fi
          git -C publish rm -rq --ignore-unmatch .
          find publish -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R "$out/." publish/
          git -C publish add -A
          if git -C publish diff --cached --quiet; then
            echo "claude-plugin branch already matches main"
            exit 0
          fi
          git -C publish commit -q -m "Claude plugin from main ${SOURCE_SHA}"
          git -C publish push origin claude-plugin
