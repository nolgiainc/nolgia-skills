name: Validate skills

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Skill frontmatter, versions and manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install PyYAML
        run: python3 -m pip install --quiet pyyaml==6.0.2

      - name: Lint skills
        run: python3 scripts/check-skills.py
